name: Build, Push, and Deploy Backend to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: enoseregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./enose_dashboard_progress/enose_dashboard_progress/backend
        push: true
        tags: enoseregistry.azurecr.io/backend-rust:latest

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container App
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: 'backend-db'
        resourceGroup: 'iotazure'
        imageToDeploy: 'enoseregistry.azurecr.io/backend-rust:latest'
